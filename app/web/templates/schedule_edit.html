{% extends "base.html" %}
{% block title %}Изменить урок — Планировщик{% endblock %}
{% block content %}
  <h1>Изменить урок</h1>

  <section class="card">
    <form method="post" action="/schedule/{{ lesson.id }}/edit" class="form-grid">
      <label>День недели
        <select name="day_of_week" required>
          {% for i in range(7) %}
            <option value="{{ i }}" {% if i == lesson.day_of_week %}selected{% endif %}>{{ day_names[i] }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Начало <input type="time" name="start_time" value="{{ lesson.start_time.strftime('%H:%M') }}" required></label>
      <label>Конец <input type="time" name="end_time" value="{{ lesson.end_time.strftime('%H:%M') if lesson.end_time else '' }}"></label>
      <label>Предмет <input type="text" name="subject" value="{{ lesson.subject }}" required></label>
      <label>Кабинет <input type="text" name="room" value="{{ lesson.room or '' }}"></label>
      <label>Учитель <input type="text" name="teacher" value="{{ lesson.teacher or '' }}"></label>
      <label>Ссылка на созвон <input type="url" name="link" value="{{ lesson.link or '' }}" placeholder="https://zoom.us/..."></label>
      <button type="submit">Сохранить</button>
      <a class="button-link" href="/schedule">Отмена</a>
    </form>
  </section>
{% endblock %}
